# vyges-odb-sys — pinned OpenROAD source for the standalone libodb build.
# Matches the vyges-openroad distribution pin so libodb tracks the shipped tool.
# Bump deliberately (manual), then re-run the build workflow.
upstream:
  source: https://github.com/The-OpenROAD-Project/OpenROAD
  commit: da9f29f18b6487825aa880597176e0fa97110b31   # nightly-da9f29f18b64, 2026-09-19
  subtree:                                            # only these are sparse-checked-out
    - src/odb
    - src/utl
    # ⛔ `cmake` dropped 2026-09-19: upstream is retiring its CMake build, and we never
    # referenced the directory. Our CMakeLists.txt reads only ${OPENROAD_SRC}/src/odb and
    # /src/utl (nine globs, one FetchContent) and deliberately never add_subdirectory()s an
    # OpenROAD CMake file, so upstream deleting its CMake build does not break this compile.
# C++ deps built FROM SOURCE at these pinned versions + static-linked (not the system's, which
# lag and break the compile). These + the build base go into the release provenance manifest.
# ⛔ These track what OpenROAD's MODULE.bazel selects AT THE PIN ABOVE, not whatever was
# current when they were chosen. Upstream is retiring CMake, so once it goes the Bazel-selected
# versions are the only ones anyone tests; a frozen set here would drift out of that coverage
# silently. Re-read MODULE.bazel at every re-pin and move these with it.
deps:
  fmt:    "11.2.0"        # fmtlib/fmt        — MODULE.bazel: fmt 11.2.0.bcr.1
  abseil: "20260107.1"    # abseil/abseil-cpp — MODULE.bazel: abseil-cpp 20260107.1
  spdlog: "v1.17.0"       # gabime/spdlog     — MODULE.bazel: spdlog 1.17.0 (built with
                          #                     SPDLOG_FMT_EXTERNAL against the pinned fmt)
  # boost: headers only (system); zlib: system (dynamic)
license:
  spdx: BSD-3-Clause                                  # OpenROAD source
notes: >
  Standalone libodb links WITHOUT tcl, swig, or-tools, or any OpenROAD engine. v1 adds LEF/DEF I/O
  (lefin/lefout/defin/defout + the si2 LEF/DEF parser libs; the parsers are BISON-generated, so
  BISON is a build-time dep — no flex). fmt/spdlog/abseil are built from source (static); only
  glibc + zlib are dynamic, so the binary is portable across Linux distros with glibc >= the build
  base. Requires C++20.
